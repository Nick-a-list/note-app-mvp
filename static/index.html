<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes MVP — Secure & Aesthetic Note Taking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .wp-default-paper {
      background-color: #fbfaf8;
      background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .wp-warm-grid {
      background-color: #fffbeb;
      background-image:
        linear-gradient(to right, rgba(217, 119, 6, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(217, 119, 6, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .wp-minimal-dots {
      background-color: #f0fdf4;
      background-image: radial-gradient(#86efac 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .wp-pastel-clouds {
      background: linear-gradient(135deg, #fdf2f8 0%, #eef2ff 50%, #f0f9ff 100%);
    }
    .wp-lavender-dream {
      background: linear-gradient(135deg, #f5f3ff 0%, #fae8ff 100%);
    }
  </style>
</head>
<body class="h-screen overflow-hidden flex bg-stone-100 text-stone-800 font-sans">
  <aside class="w-64 bg-stone-900 text-stone-100 flex flex-col justify-between p-4 select-none">
    <div class="space-y-6 overflow-y-auto">
      <div class="flex items-center justify-between">
        <h1 class="text-lg font-bold tracking-tight text-amber-400">Notes MVP</h1>
        <span class="text-xs bg-stone-800 text-stone-300 px-2 py-0.5 rounded">E2EE Ready</span>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wider text-stone-400 font-semibold mb-2">Smart Views</p>
        <ul class="space-y-1 text-sm">
          <li><button onclick="selectSmartFolder('all')" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800">📁 All Notes</button></li>
          <li><button onclick="selectSmartFolder('quick')" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800">⚡ Quick Notes</button></li>
          <li><button onclick="selectSmartFolder('bookmarks')" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800">🔖 Bookmarked</button></li>
          <li><button onclick="selectSmartFolder('todos')" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800">✅ All Todo Lists</button></li>
          <li><button onclick="selectSmartFolder('most_used')" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800">🔥 Top 20 Most Used</button></li>
        </ul>
      </div>
      <div>
        <div class="flex items-center justify-between mb-2">
          <p class="text-xs uppercase tracking-wider text-stone-400 font-semibold">Folders</p>
          <button onclick="createNewFolder()" class="text-xs text-amber-400 hover:underline">+ New</button>
        </div>
        <ul id="folders-list" class="space-y-1 text-sm"></ul>
      </div>
    </div>
  </aside>

  <section class="w-80 border-r border-stone-200 bg-white flex flex-col">
    <div class="p-3 border-b border-stone-200 space-y-2">
      <div class="flex items-center justify-between">
        <h2 id="current-view-title" class="font-semibold text-stone-800 truncate">All Notes</h2>
        <div class="flex gap-1">
          <button onclick="createNewNote('regular')" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded shadow-sm">+ Note</button>
          <button onclick="createNewNote('todo')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded shadow-sm">+ Todo</button>
        </div>
      </div>
      <input id="search-input" type="text" placeholder="Search title or notes..." oninput="loadNotes()" class="w-full px-3 py-1.5 text-sm bg-stone-100 rounded border border-stone-200 focus:outline-none focus:border-amber-500" />
    </div>
    <div id="notes-list" class="flex-1 overflow-y-auto divide-y divide-stone-100"></div>
  </section>

  <main id="editor-workspace" class="flex-1 flex flex-col wp-default-paper transition-all duration-200">
    <header class="px-6 py-3 bg-white/85 backdrop-blur border-b border-stone-200 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-xs">
        <span class="font-medium text-stone-600">Folder Wallpaper:</span>
        <select id="wallpaper-select" onchange="changeFolderWallpaper()" class="border border-stone-300 rounded px-2 py-1 bg-white text-stone-700">
          <option value="default-paper">Classic Dot Paper</option>
          <option value="warm-grid">Warm Aesthetic Grid</option>
          <option value="minimal-dots">Mint Minimal Dots</option>
          <option value="pastel-clouds">Pastel Clouds</option>
          <option value="lavender-dream">Lavender Dream</option>
        </select>
      </div>
      <div id="note-toolbar" class="hidden items-center gap-3 text-xs">
        <label class="flex items-center gap-1 cursor-pointer bg-stone-100 px-2 py-1 rounded border border-stone-200">
          <input type="checkbox" id="note-global" onchange="saveActiveNote()" />
          <span>🌐 Global</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer bg-stone-100 px-2 py-1 rounded border border-stone-200">
          <input type="checkbox" id="note-bookmarked" onchange="saveActiveNote()" />
          <span>🔖 Bookmark</span>
        </label>
        <button id="encrypt-btn" onclick="handleEncryptionAction()" class="px-2.5 py-1 rounded bg-stone-800 text-white hover:bg-stone-700">🔒 Lock (E2EE)</button>
        <button onclick="deleteActiveNote()" class="px-2.5 py-1 rounded bg-rose-100 text-rose-700 hover:bg-rose-200">Delete</button>
      </div>
    </header>

    <div id="empty-state" class="flex-1 flex items-center justify-center text-stone-400 text-sm">
      Select a note on the left or create a new one to start writing.
    </div>

    <div id="editor-container" class="hidden flex-1 flex flex-col p-8 max-w-3xl w-full mx-auto overflow-y-auto">
      <div class="flex items-center justify-between mb-2 text-xs text-stone-400">
        <span id="note-meta-info"></span>
        <span id="save-status" class="text-emerald-600 font-medium"></span>
      </div>
      <input id="note-title" type="text" placeholder="Note Title..." oninput="debouncedSave()" class="text-2xl font-bold bg-transparent border-b border-transparent focus:border-stone-300 focus:outline-none pb-2 mb-4 text-stone-900" />
      <textarea id="note-content" placeholder="Jot down your thoughts..." oninput="debouncedSave()" class="flex-1 w-full bg-white/75 backdrop-blur-sm p-4 rounded-xl border border-stone-200/80 shadow-sm focus:outline-none resize-none leading-relaxed text-stone-800"></textarea>

      <div id="todo-container" class="hidden flex-1 flex flex-col bg-white/80 backdrop-blur-sm p-5 rounded-xl border border-stone-200 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-semibold text-stone-800">Tap-to-Disappear Todo List</h3>
            <p class="text-xs text-stone-500">Tap any item to complete and remove it immediately.</p>
          </div>
          <span id="todo-count-badge" class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold text-xs">0 / 10</span>
        </div>
        <form onsubmit="addTodoItem(event)" class="flex gap-2 mb-4">
          <input id="new-todo-input" type="text" placeholder="Add a todo item..." class="flex-1 px-3 py-2 text-sm border border-stone-300 rounded-lg focus:outline-none focus:border-emerald-600" />
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg">Add</button>
        </form>
        <ul id="todo-items-list" class="space-y-2 overflow-y-auto"></ul>
      </div>
    </div>
  </main>

  <script>
    let folders = [], notes = [], currentFolderId = null, currentSmartFolder = 'all', activeNote = null, decryptedPlaintextCache = {}, saveTimer = null;
    const enc = new TextEncoder(), dec = new TextDecoder();

    function bufToBase64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
    function base64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

    async function deriveKey(passphrase, saltBytes) {
      const keyMaterial = await window.crypto.subtle.importKey('raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
      return window.crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltBytes, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    async function encryptClientSide(plaintext, passphrase) {
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(passphrase, salt);
      const ciphertextBuf = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
      return { ciphertext: bufToBase64(ciphertextBuf), iv: bufToBase64(iv), salt: bufToBase64(salt) };
    }

    async function decryptClientSide(ciphertextB64, ivB64, saltB64, passphrase) {
      const key = await deriveKey(passphrase, base64ToBuf(saltB64));
      const plainBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBuf(ivB64) }, key, base64ToBuf(ciphertextB64));
      return dec.decode(plainBuf);
    }

    async function initApp() {
      await loadFolders();
      selectSmartFolder('all');
    }

    async function loadFolders() {
      const res = await fetch('/api/folders');
      folders = await res.json();
      document.getElementById('folders-list').innerHTML = folders.map(f => `
        <li>
          <button onclick="selectFolder(${f.id})" class="w-full text-left px-3 py-1.5 rounded hover:bg-stone-800 flex items-center justify-between ${currentFolderId === f.id ? 'bg-stone-800 text-amber-400 font-semibold' : ''}">
            <span class="truncate">📂 ${f.name}</span>
          </button>
        </li>
      `).join('');
      applyCurrentWallpaper();
    }

    async function createNewFolder() {
      const name = prompt('Folder name:');
      if (!name || !name.trim()) return;
      const res = await fetch('/api/folders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim() }) });
      if (res.ok) { const f = await res.json(); await loadFolders(); selectFolder(f.id); }
    }

    function selectFolder(id) {
      currentFolderId = id; currentSmartFolder = null;
      document.getElementById('current-view-title').textContent = (folders.find(f => f.id === id) || {}).name || 'Folder';
      loadFolders(); loadNotes();
    }

    function selectSmartFolder(key) {
      currentSmartFolder = key; currentFolderId = null;
      const titles = { all: 'All Notes', quick: 'Quick Notes', bookmarks: 'Bookmarked Notes', todos: 'All Todo Lists', most_used: 'Top 20 Most Used' };
      document.getElementById('current-view-title').textContent = titles[key] || 'Notes';
      loadFolders(); loadNotes();
    }

    function applyCurrentWallpaper() {
      const workspace = document.getElementById('editor-workspace');
      let wp = 'default-paper';
      if (currentFolderId) { const f = folders.find(x => x.id === currentFolderId); if (f) wp = f.wallpaper; }
      else if (activeNote) { const f = folders.find(x => x.id === activeNote.folder_id); if (f) wp = f.wallpaper; }
      document.getElementById('wallpaper-select').value = wp;
      workspace.className = `flex-1 flex flex-col transition-all duration-200 wp-${wp}`;
    }

    async function changeFolderWallpaper() {
      const fid = currentFolderId || (activeNote ? activeNote.folder_id : (folders[0] && folders[0].id));
      if (!fid) return;
      await fetch(`/api/folders/${fid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wallpaper: document.getElementById('wallpaper-select').value }) });
      await loadFolders();
    }

    async function loadNotes() {
      const p = new URLSearchParams();
      if (currentFolderId) p.set('folder_id', currentFolderId);
      if (currentSmartFolder) p.set('smart_folder', currentSmartFolder);
      const s = document.getElementById('search-input').value.trim();
      if (s) p.set('search', s);
      const res = await fetch(`/api/notes?${p.toString()}`);
      notes = await res.json();
      renderNotesList();
    }

    function renderNotesList() {
      const container = document.getElementById('notes-list');
      if (!notes.length) { container.innerHTML = `<p class="p-6 text-xs text-stone-400 text-center">No notes found.</p>`; return; }
      container.innerHTML = notes.map(n => `
        <div onclick="openNote(${n.id})" class="p-3.5 cursor-pointer hover:bg-stone-50 transition ${activeNote && activeNote.id === n.id ? 'bg-amber-50/80 border-l-4 border-amber-500' : ''}">
          <div class="flex items-center justify-between gap-2 mb-1">
            <h4 class="font-semibold text-sm text-stone-800 truncate">${n.title || 'Untitled'}</h4>
            <div class="flex items-center gap-1 shrink-0">
              ${n.is_global ? '🌐' : ''} ${n.is_encrypted ? '🔒' : ''} ${n.is_bookmarked ? '🔖' : ''}
            </div>
          </div>
          <p class="text-xs text-stone-500 truncate">${n.note_type === 'todo' ? `✅ Todo List (${(n.todo_items \vert{}\vert{} []).length}/${n.max_items_rule})` : (n.is_encrypted ? 'Encrypted' : (n.content || ''))}</p>
        </div>
      `).join('');
    }

    async function createNewNote(type) {
      const fid = currentFolderId || (folders[0] && folders[0].id);
      if (!fid) return;
      const res = await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder_id: fid, title: type === 'todo' ? 'New Todo List' : 'Untitled Note', note_type: type, todo_items: [], max_items_rule: 10 }) });
      if (res.ok) { const n = await res.json(); await loadNotes(); openNote(n.id); }
    }

    async function openNote(id) {
      const res = await fetch(`/api/notes/${id}`);
      if (!res.ok) return;
      activeNote = await res.json();
      applyCurrentWallpaper();

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('editor-container').classList.remove('hidden');
      document.getElementById('note-toolbar').classList.remove('hidden');
      document.getElementById('note-toolbar').classList.add('flex');

      document.getElementById('note-title').value = activeNote.title;
      document.getElementById('note-global').checked = activeNote.is_global;
      document.getElementById('note-bookmarked').checked = activeNote.is_bookmarked;

      const cb = document.getElementById('note-content'), tb = document.getElementById('todo-container');
      if (activeNote.note_type === 'todo') {
        cb.classList.add('hidden'); tb.classList.remove('hidden'); renderTodoItems();
      } else {
        tb.classList.add('hidden'); cb.classList.remove('hidden');
        if (activeNote.is_encrypted) {
          cb.value = decryptedPlaintextCache[activeNote.id] || `[Encrypted Note - Click Lock to Decrypt]`;
          cb.disabled = decryptedPlaintextCache[activeNote.id] === undefined;
        } else {
          cb.value = activeNote.content; cb.disabled = false;
        }
      }
      renderNotesList();
    }

    function debouncedSave() {
      document.getElementById('save-status').textContent = 'Saving...';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveActiveNote, 400);
    }

    async function saveActiveNote() {
      if (!activeNote) return;
      await fetch(`/api/notes/${activeNote.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('note-title').value,
          is_global: document.getElementById('note-global').checked,
          is_bookmarked: document.getElementById('note-bookmarked').checked,
          content: activeNote.note_type === 'regular' && !activeNote.is_encrypted ? document.getElementById('note-content').value : activeNote.content
        })
      });
      document.getElementById('save-status').textContent = 'Saved ✓';
      loadNotes();
    }

    async function handleEncryptionAction() {
      if (!activeNote || activeNote.note_type !== 'regular') return;
      if (!activeNote.is_encrypted) {
        const pass = prompt('Enter passphrase to encrypt note:');
        if (!pass) return;
        const encData = await encryptClientSide(document.getElementById('note-content').value, pass);
        await fetch(`/api/notes/${activeNote.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: encData.ciphertext, is_encrypted: true, encryption_iv: encData.iv, encryption_salt: encData.salt }) });
        delete decryptedPlaintextCache[activeNote.id];
        openNote(activeNote.id);
      } else {
        const pass = prompt('Enter passphrase to decrypt note:');
        if (!pass) return;
        try {
          decryptedPlaintextCache[activeNote.id] = await decryptClientSide(activeNote.content, activeNote.encryption_iv, activeNote.encryption_salt, pass);
          openNote(activeNote.id);
        } catch { alert('Incorrect passphrase.'); }
      }
    }

    function renderTodoItems() {
      const items = activeNote.todo_items || [];
      document.getElementById('todo-count-badge').textContent = `${items.length} / ${activeNote.max_items_rule}`;
      document.getElementById('todo-items-list').innerHTML = items.length ? items.map((t, i) => `
        <li onclick="completeTodo(${i})" class="flex items-center justify-between px-3.5 py-2.5 bg-stone-50 hover:bg-emerald-50 border border-stone-200 rounded-lg cursor-pointer transition">
          <span class="text-sm text-stone-800">${t}</span>
          <span class="text-xs text-emerald-600 font-medium">Tap to clear ✓</span>
        </li>
      `).join('') : `<li class="text-xs text-stone-400 italic py-4 text-center">No pending todos.</li>`;
    }

    async function addTodoItem(e) {
      e.preventDefault();
      const input = document.getElementById('new-todo-input');
      const val = input.value.trim();
      if (!val) return;
      const res = await fetch(`/api/notes/${activeNote.id}/todos`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: val }) });
      if (res.ok) { activeNote = await res.json(); input.value = ''; renderTodoItems(); loadNotes(); }
      else { alert('Max limit reached (10 items)!'); }
    }

    async function completeTodo(idx) {
      const res = await fetch(`/api/notes/${activeNote.id}/todos/${idx}`, { method: 'DELETE' });
      if (res.ok) { activeNote = await res.json(); renderTodoItems(); loadNotes(); }
    }

    async function deleteActiveNote() {
      if (!activeNote || !confirm('Delete note?')) return;
      await fetch(`/api/notes/${activeNote.id}`, { method: 'DELETE' });
      activeNote = null;
      document.getElementById('editor-container').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      loadNotes();
    }

    initApp();
  </script>
</body>
</html>
